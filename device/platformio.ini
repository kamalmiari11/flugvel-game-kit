; On-hardware build of the game kit. Only needed if you were sent a unit -
; everything can be developed and tested in the simulator without one.
;
;   cd device && pio run -t upload && pio device monitor
;
; The knob press cycles through the games in games/registry.cpp; the button
; plays the current one.

[platformio]
; The sources live one level up, shared with the desktop build, so the same
; game files are compiled for both targets - no copying, no drift.
src_dir = ..
include_dir = ../include

[env:esp32dev]
; Pinned to the 6.x line on purpose. That is what gives you Arduino-ESP32
; core 2.x, which is what the device firmware is built against - and the
; LEDC calls the buzzer uses (ledcSetup / ledcAttachPin / ledcWriteTone)
; were replaced in core 3.x. Left unpinned, this file builds on a machine
; with an older platform already cached and fails to compile on a fresh
; install, which is the worst kind of difference to debug remotely.
platform = espressif32@^6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200

; Same partition table as the device firmware. Nothing here needs the extra
; room - the point is that flashing this kit and flashing the firmware do
; not rewrite the flash layout differently each time. NVS sits at the same
; offset in both, so whatever is stored on the device survives either way.
board_build.partitions = min_spiffs.csv

; Deliberately unpinned, matching the firmware: these are the versions the
; device is built with today.
lib_deps =
    bodmer/TFT_eSPI
    ESP32Encoder

; Compile the kit, the games and the device harness - and nothing from the
; desktop simulator or the test bench.
build_src_filter =
    -<*>
    +<src/gamekit/>
    +<games/>
    +<device/src/>

build_flags =
    -I ../games
    -I ../device

    ; ---- panel ----------------------------------------------------------
    ; A 240x320 ST7789 over SPI. These must match the firmware exactly or
    ; what you see here will not be what the device shows.
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    ; CGRAM_OFFSET is deliberately NOT set. It exists for ST7789 boards whose
    ; visible area is smaller than the controller's 240x320 memory, and the
    ; driver's fallback assumes a 240x240 panel - which shifts everything a
    ; quarter of the way across the screen in some rotations. This panel
    ; really is 240x320. Do not add it back from a setup snippet you found.
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_CS=5
    -D TFT_DC=2
    -D TFT_RST=4
    -D TFT_BL=27
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000
    -D TFT_RGB_ORDER=TFT_RGB

    ; ---- fonts ----------------------------------------------------------
    ; USER_SETUP_LOADED=1 means the driver compiles in no font glyphs at all
    ; unless told to, and every print()/drawString() silently draws nothing.
    ; GLCD is the one font this project uses; adding the others costs flash
    ; for glyphs nothing references.
    -D LOAD_GLCD=1
